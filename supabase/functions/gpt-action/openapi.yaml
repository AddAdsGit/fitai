openapi: 3.1.0
info:
  title: FitAI GPT Sync Action API
  description: |
    API for synchronizing user profiles, food/nutrition logs, recipes, and memories with the FitAI dashboard.
    
    CRITICAL BEHAVIORAL RULES FOR THE CUSTOM GPT:
    1. Recipe Modifications & Extras: If the user logs a meal that modifies a stored recipe (e.g., "burrito with extra chicken and rice"), the GPT must:
       a. Call GET /recipes to list recipes, matching the base item ("burrito").
       b. Retrieve the macros for the base recipe.
       c. Estimate the nutritional values of the extras specified (e.g., extra chicken and rice).
       d. Sum the base macros and the extras macros to compute the new total.
       e. Log the combined meal via POST /meals using the combined macros and appending the extra description to the name (e.g. "Burrito with extra chicken and rice").
    2. Editing Logged Meals by Instruction: If the user wants to adjust a logged meal (e.g., "actually, make that breakfast 2 eggs instead of 1"), the GPT must:
       a. Call GET /meals?date=YYYY-MM-DD to find the target meal.
       b. Estimate the updated calorie/macro totals based on the change request.
       c. Call PATCH /meals?id=<id> with the updated calorie/macro numbers.
    3. Deleting Logged Meals: If the user requests to delete or remove a logged item, the GPT must call GET /meals to find the ID and invoke DELETE /meals?id=<id>.
  version: 1.0.0
servers:
  - url: https://twrjigbbgioqdpwvkblo.supabase.co/functions/v1/gpt-action
    description: Supabase Edge Function URL for project twrjigbbgioqdpwvkblo
paths:
  /profile:
    get:
      summary: Retrieve the user's profile details
      description: Fetches bios, preferences, custom memories, weight/height info, and calorie/macro goals.
      operationId: getProfile
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      display_name:
                        type: string
                      description:
                        type: string
                      height:
                        type: integer
                      weight:
                        type: number
                      memories:
                        type: array
                        items:
                          type: string
                      preferences:
                        type: array
                        items:
                          type: string
                      daily_calories_goal:
                        type: integer
                      weight_goal:
                        type: number
    post:
      summary: Update user profile or add memories
      description: Modify user specifications or add new nutritional habits, likes, dislikes, allergies, or fitness details.
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                height:
                  type: integer
                weight:
                  type: number
                description:
                  type: string
                gender:
                  type: string
                daily_calories_goal:
                  type: integer
                weight_goal:
                  type: number
                preferences:
                  type: array
                  items:
                    type: string
                memories:
                  type: array
                  description: Array of strings containing details or notes (e.g. "prefers eggs", "allergic to shellfish"). These are merged with existing records.
                  items:
                    type: string
      responses:
        '200':
          description: Profile updated successfully
  /meals:
    get:
      summary: Get logged meals for a specific date
      description: Fetch all breakfast, lunch, dinner, or other logged items for a given day.
      operationId: getMeals
      parameters:
        - name: date
          in: query
          description: The target log date in YYYY-MM-DD format. Defaults to today's date.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Logged meals retrieved successfully
    post:
      summary: Log a new meal
      description: Record a consumed item, specifying name, macros (protein, carbs, fats), and calorie count. Trigger automatic Notion & Google Sheets sync if configured.
      operationId: logMeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - calories
              properties:
                name:
                  type: string
                  description: The name of the meal (e.g. "Avocado Toast with Egg")
                calories:
                  type: integer
                  description: Total calories in kcal
                protein:
                  type: integer
                  description: Protein in grams
                carbs:
                  type: integer
                  description: Carbohydrates in grams
                fats:
                  type: integer
                  description: Fats in grams
                type:
                  type: string
                  description: Categorization of the log (e.g. "Breakfast", "Lunch", "Dinner", "Snack")
                time:
                  type: string
                  description: Time of consumption (e.g. "8:30 AM")
                date:
                  type: string
                  description: Target date in YYYY-MM-DD format. Defaults to today.
                image:
                  type: string
                  description: Optional public web image URL of this food item. You can search the web (e.g. Unsplash or open food databases) to find a high-quality relevant picture link matching this food.
      responses:
        '201':
          description: Meal logged successfully
    delete:
      summary: Delete a logged meal
      description: Remove a logged meal entry from the dashboard by its unique ID.
      operationId: deleteMeal
      parameters:
        - name: id
          in: query
          description: The unique UUID of the meal to delete.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Meal deleted successfully
        '400':
          description: Missing ID parameter
        '404':
          description: Meal not found
    patch:
      summary: Update a logged meal
      description: Modify properties of an existing logged meal by its unique ID.
      operationId: updateMeal
      parameters:
        - name: id
          in: query
          description: The unique UUID of the meal to update.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                calories:
                  type: integer
                protein:
                  type: integer
                carbs:
                  type: integer
                fats:
                  type: integer
                type:
                  type: string
                time:
                  type: string
                date:
                  type: string
                image:
                  type: string
      responses:
        '200':
          description: Meal updated successfully
        '400':
          description: Missing ID or invalid parameters
        '404':
          description: Meal not found
  /recipes:
    get:
      summary: List user recipes
      description: Retrieve stored recipes with their instructions and ingredients.
      operationId: getRecipes
      responses:
        '200':
          description: Recipes retrieved successfully
    post:
      summary: Save a new custom recipe
      description: Store a custom dish outline, including cooking time, macros, tags, ingredients, and instructions.
      operationId: saveRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                time:
                  type: string
                  description: E.g., "25 mins"
                calories:
                  type: integer
                protein:
                  type: integer
                carbs:
                  type: integer
                fats:
                  type: integer
                tags:
                  type: array
                  items:
                    type: string
                ingredients:
                  type: array
                  items:
                    type: string
                instructions:
                  type: string
      responses:
        '201':
          description: Recipe saved successfully
components:
  schemas: {}
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
security:
  - BearerAuth: []
