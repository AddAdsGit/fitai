openapi: 3.1.0
info:
  title: FitAI API
  description: API for syncing profiles, meals, recipes, and wellness with FitAI.
  version: 1.0.0
servers:
  - url: https://fitpush.vercel.app/api
paths:
  /profile:
    get:
      summary: Get user profile
      operationId: getProfile
      responses:
        '200':
          description: Returns profile metadata including goals (daily_calories_goal, weight_goal), agent_config (artStyle, customInstructions, etc.), agent_memory[], and knowledge (preferences[], health[], notes[], patterns[]).
    post:
      x-openai-isConsequential: false
      summary: Update user profile or add memories
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                height:
                  type: integer
                weight:
                  type: number
                daily_calories_goal:
                  type: integer
                weight_goal:
                  type: number
                preferences:
                  type: array
                  description: Dietary preferences tags (e.g. Keto, Vegan, Gluten Free)
                  items:
                    type: string
                telegram_reminders_enabled:
                  type: boolean
                  description: Enable or disable daily/periodic logging reminder pings.
                telegram_reports_enabled:
                  type: boolean
                  description: Enable or disable the end-of-day summary reports.
                telegram_reminder_times:
                  type: array
                  description: Array of time strings in 24-hour HH:MM format when reminders should be sent (e.g. ["09:00", "20:00"]).
                  items:
                    type: string
                timezone:
                  type: string
                  description: The user's local timezone (e.g. "Asia/Kolkata", "America/New_York").
                knowledge_preferences:
                  type: array
                  description: Factual food/cooking preferences (e.g. "likes eggs", "prefers spicy food")
                  items:
                    type: string
                knowledge_health:
                  type: array
                  description: Medical/health facts (e.g. "allergic to peanuts", "lactose intolerant")
                  items:
                    type: string
                knowledge_notes:
                  type: array
                  description: General routines or dietary observations (e.g. "usually eats late on Wednesdays")
                  items:
                    type: string
                knowledge_patterns:
                  type: array
                  description: Health-food correlations (e.g. "biryani from restaurant X causes bloating")
                  items:
                    type: string
                agent_memory:
                  type: array
                  description: Conversation and tone guidelines for the agent (e.g. "prefers brief replies")
                  items:
                    type: string
      responses:
        '200':
          description: OK
  /meals:
    get:
      summary: Get meals for a date
      operationId: getMeals
      parameters:
        - name: date
          in: query
          description: Date in YYYY-MM-DD. Defaults to today.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
    post:
      x-openai-isConsequential: false
      summary: Log a new meal
      operationId: logMeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - calories
              properties:
                name:
                  type: string
                calories:
                  type: integer
                protein:
                  type: integer
                carbs:
                  type: integer
                fats:
                  type: integer
                type:
                  type: string
                  description: Breakfast, Lunch, Dinner, or Snack
                time:
                  type: string
                  description: e.g. "8:30 AM"
                date:
                  type: string
                  description: YYYY-MM-DD. Defaults to today.
                image:
                  type: string
                  description: Leave EMPTY. Server auto-generates food photo. Only pass if user provides a direct public URL.
                timezone:
                  type: string
                  description: e.g. "Asia/Kolkata". Used to resolve local date/time.
                meal_description:
                  type: string
                  description: Optional notes (ingredients, prep style, nutritional score).
                openaiFileIdRefs:
                  type: array
                  description: User-uploaded photo refs with id, name, mime_type, download_link.
                  items:
                    type: object
      responses:
        '201':
          description: Meal logged
    delete:
      x-openai-isConsequential: false
      summary: Delete a meal
      operationId: deleteMeal
      parameters:
        - name: id
          in: query
          description: UUID of meal to delete
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
    patch:
      x-openai-isConsequential: false
      summary: Update a meal
      operationId: updateMeal
      parameters:
        - name: id
          in: query
          description: UUID of meal to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                calories:
                  type: integer
                protein:
                  type: integer
                carbs:
                  type: integer
                fats:
                  type: integer
                type:
                  type: string
                time:
                  type: string
                date:
                  type: string
                image:
                  type: string
                meal_description:
                  type: string
      responses:
        '200':
          description: Updated
  /daily-wellness:
    get:
      summary: Get daily wellness notes
      operationId: getDailyWellness
      parameters:
        - name: date
          in: query
          description: YYYY-MM-DD. Defaults to today.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
    post:
      summary: Save daily wellness notes
      operationId: saveDailyWellness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notes
              properties:
                date:
                  type: string
                  description: YYYY-MM-DD. Defaults to today.
                notes:
                  type: string
      responses:
        '200':
          description: Saved
  /recipes:
    get:
      summary: List user recipes
      operationId: getRecipes
      responses:
        '200':
          description: OK
    post:
      x-openai-isConsequential: false
      summary: Save a recipe
      operationId: saveRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                time:
                  type: string
                calories:
                  type: integer
                protein:
                  type: integer
                carbs:
                  type: integer
                fats:
                  type: integer
                tags:
                  type: array
                  items:
                    type: string
                ingredients:
                  type: array
                  items:
                    type: string
                instructions:
                  type: string
      responses:
        '201':
          description: Saved
components:
  schemas: {}
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
security:
  - BearerAuth: []
